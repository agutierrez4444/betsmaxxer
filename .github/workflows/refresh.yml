# Runs the pipeline every morning and commits the new JSON.
# Vercel redeploys automatically on each commit.
# Only does anything once this folder is pushed to GitHub.
name: Refresh data

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 9am Eastern
    - cron: "0 21 * * *"   # 21:00 UTC = 5pm Eastern (catches late lineup/odds changes)
  workflow_dispatch: {}     # "Run workflow" button in GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York   # so "today" matches the NHL schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - run: pip install -r requirements.txt
      - run: python -m pipeline.build
      - run: python -m pipeline.nfl_build
      - run: python -m pipeline.nba_build
      - name: Commit data
        run: |
          git config user.name "betsmaxxer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Refresh data $(date +%F)"
          git push
